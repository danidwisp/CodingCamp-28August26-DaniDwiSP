<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <h1>Expense Tracker</h1>
    <div class="balance-display">
      <span class="balance-label">Total Spending</span>
      <span id="total-balance">Rp 0,00</span>
    </div>

    <div class="limit-control">
      <button type="button" id="theme-toggle" class="theme-toggle">
  🌙 Dark Mode
</button>
  <label for="limit-input">Spending Limit</label>
  <input
    type="number"
    id="limit-input"
    min="0"
    step="0.01"
    placeholder="e.g. 500000"
  />
  <span id="limit-status" aria-live="polite"></span>
</div>

  </header>

  <main class="app-main">

    <section class="form-section">
      <h2>Add Transaction</h2>
      <form id="transaction-form" novalidate>

        <div class="field-group">
          <label for="input-name">Item Name</label>
          <input
            type="text"
            id="input-name"
            name="name"
            placeholder="e.g. Coffee"
            autocomplete="off"
          />
          <span class="field-error" id="error-name" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="input-amount">Amount</label>
          <input
            type="number"
            id="input-amount"
            name="amount"
            placeholder="e.g. 15000"
            min="0.01"
            step="0.01"
          />
          <span class="field-error" id="error-amount" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="select-category">Category</label>
          <select id="select-category" name="category">
            <option value="" disabled selected>-- Select a category --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="field-error" id="error-category" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn-primary">Add Transaction</button>

      </form>
    </section>

    <section class="chart-section">
      <h2>Spending by Category</h2>
      <canvas id="spending-chart" aria-label="Spending pie chart" role="img"></canvas>
      <p id="chart-placeholder" class="placeholder-text">No spending data yet. Add a transaction to see your chart.</p>
    </section>

    <section class="list-section">
  <div class="list-header">
    <h2>Transactions</h2>

    <div class="sort-control">
      <label for="sort-select">Sort by</label>
      <select id="sort-select">
        <option value="added">Order added</option>
        <option value="amount-asc">Amount: Low to High</option>
        <option value="amount-desc">Amount: High to Low</option>
        <option value="category">Category A-Z</option>
      </select>
    </div>
  </div>

  <ul id="transaction-list"></ul>
  <p id="list-placeholder" class="placeholder-text">No transactions added yet.</p>
</section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
